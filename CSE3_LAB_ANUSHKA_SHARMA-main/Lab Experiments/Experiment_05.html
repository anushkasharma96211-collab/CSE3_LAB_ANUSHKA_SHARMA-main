<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
     <h2 align="center">Student Registration Form</h2>
     <hr>

     <form action ="submit.html" method="post">


            <label for ='name'> Full Name:</label>
            <input type ="text" name ="name" id="name" placeholder="Enter your full name" required> 
            <br><br>


            <label for ="email">Email:</label>
            <input type="Email" name ="email" id="email" placeholder="Enter valid email address" required> 
            <br><br>


            <label for ="passwd">Password:</label>
            <input type ="Password" name ="passwd" id="passwd" placeholder="Enter  password" required>
            <br><br>

 
            <label for ="Gender">Gender:</label>
            <input type="radio" name="gen" id="gen" > 
            <label for=""Female">Female</label>
            <input type="radio" name="gen" id="gen" > 
            <label for=""Male">Male</label>
            <br><br>


          <label for="Course">Course</label>
          <select name="course" required>
            <option value="">--Select Course--</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="AI">AI</option>
            <option value="DS">DS</option>
            </select>
            <br><br>


           <label for ="Contact ">Contact no.:</label>   
           <input type="tel" name="contact" placeholder="Enter phone number">
           <br><br>


            <label for="address">Address:</label>
            <br>
            <textarea name="address" rows="4" cols="50" placeholder="Enter your address" required></textarea>
            <br><br>


            <input type="submit" value="Register" > 
            <input type="reset" value="Clear" > 

            

        </form>

    <hr>

    <p align ="center">&copy;2025 Student Registration Portal</p>

</body>
</html>
